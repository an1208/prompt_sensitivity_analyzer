[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-sensitivity-analyser"
version = "1.0.0"
description = "Quantify how much LLM outputs change when a prompt is paraphrased (cosine similarity of output embeddings)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "requests>=2.28"]

[project.optional-dependencies]
hf = ["torch>=2.0", "transformers>=4.38", "sentence-transformers>=2.6", "accelerate>=0.26"]
embed = ["sentence-transformers>=2.6"]
plots = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
psa = "psa.cli:main"

[tool.setuptools.packages.find]
include = ["psa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
